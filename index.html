<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Missile Dodge</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #0a0e1a; touch-action: none; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
canvas { display: block; }
#mobile-block {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: #0a0e1a; z-index: 100;
  justify-content: center; align-items: center; flex-direction: column; gap: 16px;
  font-family: monospace; text-align: center; padding: 32px;
}
#mobile-block .mb-title {
  color: #00f0ff; font-size: 28px; font-weight: bold; letter-spacing: 4px;
  text-shadow: 0 0 15px rgba(0,240,255,0.5);
}
#mobile-block .mb-text { color: #667788; font-size: 15px; line-height: 1.6; }
#mobile-block .mb-url { color: #4a5568; font-size: 13px; margin-top: 12px; }
@media (max-width: 768px) {
  #mobile-block { display: flex; }
  canvas, #name-overlay { display: none !important; }
}
#name-overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
  justify-content: center; align-items: center; flex-direction: column; gap: 20px;
}
#name-overlay.active { display: flex; }
#name-overlay::before {
  content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(10,14,26,0.92); z-index: -1;
}
#name-overlay input {
  background: rgba(10,14,26,0.95); border: 2px solid #00f0ff; color: #00f0ff;
  font: bold 24px monospace; text-align: center; padding: 12px 20px; width: 320px; max-width: 80vw;
  outline: none; border-radius: 4px; caret-color: #00f0ff;
}
#name-overlay input::placeholder { color: rgba(0,240,255,0.3); }
#name-overlay input:focus { box-shadow: 0 0 20px rgba(0,240,255,0.3); }
#name-overlay .name-label {
  color: #00f0ff; font: bold 28px monospace; text-shadow: 0 0 15px rgba(0,240,255,0.5);
}
#name-overlay .name-hint { color: #667788; font: 14px monospace; }
#name-overlay .name-start-btn {
  background: transparent; border: 2px solid #00f0ff; color: #00f0ff;
  font: bold 18px monospace; padding: 10px 40px; cursor: pointer; border-radius: 4px;
  transition: all 0.2s;
}
#name-overlay .name-start-btn:hover { background: rgba(0,240,255,0.15); box-shadow: 0 0 15px rgba(0,240,255,0.3); }
</style>
</head>
<body>
<div id="mobile-block">
  <div class="mb-title">MISSILE DODGE</div>
  <div class="mb-text">This game requires a keyboard to play.<br>Please open on a desktop browser.</div>
  <div class="mb-url">missiledodge.srikardurgi.com</div>
</div>
<canvas id="game"></canvas>
<div id="name-overlay">
  <div class="name-label">ENTER YOUR CALLSIGN</div>
  <input type="text" id="name-input" maxlength="20" placeholder="Pilot name..." autocomplete="off" />
  <div class="name-hint">1-20 characters (letters, numbers, spaces)</div>
  <button class="name-start-btn" id="name-start-btn">LAUNCH</button>
</div>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// --- Constants ---
const COLORS = {
  bg: '#0a0e1a',
  player: '#00f0ff',
  playerGlow: '#ffffff',
  enemy: '#ff3a2f',
  enemyGunship: '#cc2020',
  enemyBomber: '#8b1a1a',
  missile: '#ffe34d',
  missileTrail: '#ff8c00',
  uiText: '#ffffff',
  combo: '#ffd700',
  decoy: '#ff44ff',
};

const FRICTION = 0.98;
const PLAYER_ACCEL = 0.45;
const PLAYER_MAX_SPEED = 5.5;
const AFTERBURNER_MULT = 2.0;
const AFTERBURNER_DURATION = 800; // ms
const AFTERBURNER_COOLDOWN = 3000; // ms
const INVINCIBILITY_DURATION = 2000; // ms
const COMBO_WINDOW = 3000; // ms
const WAVE_DURATION = 20000; // ms
const WAVE_BREATHER = 2000; // ms
const NEAR_MISS_DIST = 20;
const MISSILE_LIFETIME = 12000; // ms
const MISSILE_BOOST_TIME = 8000; // ms
const DECOY_COOLDOWN = 15000; // ms
const DECOY_DURATION = 3000; // ms
const DECOY_ATTRACT_RADIUS = 250; // px

// --- Game Settings (easy mode as default) ---
const GAME_SETTINGS = {
  missileSpeedMult: 0.75,
  deflectRadius: 65,
  deflectStrength: 0.18,
  lives: 5,
  scoreMultiplier: 1.0,
};

// --- State ---
let W, H;
let state = 'MENU'; // MENU, NAME_ENTRY, PLAYING, PAUSED, GAME_OVER, LEADERBOARD
let dt = 0;
let lastTime = 0;
let score = 0;
function getHighScore() { return parseInt(localStorage.getItem('missileDodgeHighScore')) || 0; }
function setHighScore(val) { localStorage.setItem('missileDodgeHighScore', val); }
let highScore = getHighScore('normal');
let lives = 3;
let wave = 0;
let waveTimer = 0;
let waveAnnounceTimer = 0;
let waveBreatherTimer = 0;
let inBreather = false;
let combo = 0;
let comboTimer = 0;
let comboMultiplier = 1;
let enemiesDestroyed = 0;
let highestCombo = 0;
let shakeIntensity = 0;
let shakeTimer = 0;

let player, enemies, missiles, particles, textPopups, stars;
let activeDecoy = null;
let heartPickup = null;

// --- Leaderboard ---
let playerName = localStorage.getItem('missileDodgePlayerName') || '';
let leaderboardData = null;
let leaderboardLoading = false;
let playerRank = null;
let scoreSubmitted = false;
let heartSpawnTimer = 0;
const HEART_SPAWN_INTERVAL = 45000; // ms
const HEART_DURATION = 10000; // ms
const HEART_PICKUP_RADIUS = 20;
let keys = {};

// --- Resize ---
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// --- Input ---
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Enter') {
    if (state === 'MENU') { showNameEntry(); }
    else if (state === 'GAME_OVER') { showLeaderboard(); }
    else if (state === 'LEADERBOARD') { state = 'MENU'; }
  }
  if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'PLAYING') state = 'PAUSED';
  else if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'PAUSED') state = 'PLAYING';
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// --- Touch Controls ---
const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
const touch = {
  joystick: { active: false, id: null, startX: 0, startY: 0, curX: 0, curY: 0, dx: 0, dy: 0 },
  boost: { active: false, id: null },
  JOYSTICK_RADIUS: 60,
  JOYSTICK_DEAD: 10,
  BOOST_RADIUS: 40,
  PAUSE_SIZE: 44,
};

function getBoostCenter() { return { x: W - 70, y: H - 90 }; }
function getDecoyCenter() { return { x: W - 70, y: H - 160 }; }
function getPauseCenter() { return { x: W - 30, y: 30 }; }

function isTouchInBoostArea(tx, ty) {
  const c = getBoostCenter();
  const d = Math.sqrt((tx - c.x) ** 2 + (ty - c.y) ** 2);
  return d < touch.BOOST_RADIUS + 15;
}

function isTouchInDecoyArea(tx, ty) {
  const c = getDecoyCenter();
  const d = Math.sqrt((tx - c.x) ** 2 + (ty - c.y) ** 2);
  return d < touch.BOOST_RADIUS + 15;
}

function isTouchInPauseArea(tx, ty) {
  const c = getPauseCenter();
  return Math.abs(tx - c.x) < touch.PAUSE_SIZE && Math.abs(ty - c.y) < touch.PAUSE_SIZE;
}

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    const tx = t.clientX, ty = t.clientY;

    // Menu — tap to enter name
    if (state === 'MENU') { showNameEntry(); return; }
    // Game over — tap to show leaderboard
    if (state === 'GAME_OVER') { showLeaderboard(); return; }
    // Leaderboard — tap to go to menu
    if (state === 'LEADERBOARD') { state = 'MENU'; return; }

    // Pause button
    if (state === 'PLAYING' && isTouchInPauseArea(tx, ty)) { state = 'PAUSED'; return; }
    if (state === 'PAUSED') { state = 'PLAYING'; return; }

    // Boost button
    if (isTouchInBoostArea(tx, ty)) {
      touch.boost.active = true;
      touch.boost.id = t.identifier;
      keys['Space'] = true;
      continue;
    }

    // Decoy button
    if (isTouchInDecoyArea(tx, ty)) {
      keys['KeyF'] = true;
      setTimeout(() => { keys['KeyF'] = false; }, 100);
      continue;
    }

    // Joystick — any touch on left half (or anywhere not boost)
    if (!touch.joystick.active) {
      touch.joystick.active = true;
      touch.joystick.id = t.identifier;
      touch.joystick.startX = tx;
      touch.joystick.startY = ty;
      touch.joystick.curX = tx;
      touch.joystick.curY = ty;
      touch.joystick.dx = 0;
      touch.joystick.dy = 0;
    }
  }
}, { passive: false });

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === touch.joystick.id && touch.joystick.active) {
      touch.joystick.curX = t.clientX;
      touch.joystick.curY = t.clientY;
      let ddx = touch.joystick.curX - touch.joystick.startX;
      let ddy = touch.joystick.curY - touch.joystick.startY;
      const dist = Math.sqrt(ddx * ddx + ddy * ddy);
      if (dist < touch.JOYSTICK_DEAD) { touch.joystick.dx = 0; touch.joystick.dy = 0; }
      else {
        const clamped = Math.min(dist, touch.JOYSTICK_RADIUS);
        touch.joystick.dx = (ddx / dist) * (clamped / touch.JOYSTICK_RADIUS);
        touch.joystick.dy = (ddy / dist) * (clamped / touch.JOYSTICK_RADIUS);
      }
    }
  }
}, { passive: false });

canvas.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === touch.joystick.id) {
      touch.joystick.active = false;
      touch.joystick.id = null;
      touch.joystick.dx = 0;
      touch.joystick.dy = 0;
    }
    if (t.identifier === touch.boost.id) {
      touch.boost.active = false;
      touch.boost.id = null;
      keys['Space'] = false;
    }
  }
}, { passive: false });

canvas.addEventListener('touchcancel', e => {
  for (const t of e.changedTouches) {
    if (t.identifier === touch.joystick.id) {
      touch.joystick.active = false; touch.joystick.id = null; touch.joystick.dx = 0; touch.joystick.dy = 0;
    }
    if (t.identifier === touch.boost.id) {
      touch.boost.active = false; touch.boost.id = null; keys['Space'] = false;
    }
  }
});

// --- Stars (parallax + nebula) ---
let nebulas = [];
function initStars() {
  stars = [];
  // Far layer — tiny bluish dust
  for (let i = 0; i < 60; i++) {
    stars.push({
      x: Math.random() * W, y: Math.random() * H,
      size: 1, speed: 0.08 + Math.random() * 0.05,
      alpha: 0.25 + Math.random() * 0.25,
      color: '#4a5878', layer: 0,
      twinkle: Math.random() * Math.PI * 2,
    });
  }
  // Mid layer
  for (let i = 0; i < 50; i++) {
    stars.push({
      x: Math.random() * W, y: Math.random() * H,
      size: 1 + Math.random(), speed: 0.18 + Math.random() * 0.1,
      alpha: 0.35 + Math.random() * 0.35,
      color: '#8892b0', layer: 1,
      twinkle: Math.random() * Math.PI * 2,
    });
  }
  // Near layer — bright twinkling white
  for (let i = 0; i < 30; i++) {
    stars.push({
      x: Math.random() * W, y: Math.random() * H,
      size: 1.5 + Math.random() * 1.5, speed: 0.35 + Math.random() * 0.15,
      alpha: 0.6 + Math.random() * 0.4,
      color: '#ffffff', layer: 2,
      twinkle: Math.random() * Math.PI * 2,
    });
  }
  // Nebula blobs
  nebulas = [];
  const nebulaColors = ['rgba(0,240,255,', 'rgba(255,68,255,', 'rgba(80,120,255,', 'rgba(180,80,255,'];
  for (let i = 0; i < 4; i++) {
    nebulas.push({
      x: Math.random() * W, y: Math.random() * H,
      radius: 200 + Math.random() * 180,
      colorBase: nebulaColors[i % nebulaColors.length],
      speed: 0.04 + Math.random() * 0.04,
    });
  }
}
initStars();

function updateStars() {
  for (const s of stars) {
    s.y += s.speed * dt * 60;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    s.twinkle += dt * (s.layer === 2 ? 3 : 1.5);
  }
  for (const n of nebulas) {
    n.y += n.speed * dt * 60;
    if (n.y - n.radius > H) { n.y = -n.radius; n.x = Math.random() * W; }
  }
}

function drawStars() {
  // Nebula blobs (drawn first, behind stars)
  for (const n of nebulas) {
    const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.radius);
    grad.addColorStop(0, n.colorBase + '0.06)');
    grad.addColorStop(0.5, n.colorBase + '0.03)');
    grad.addColorStop(1, n.colorBase + '0)');
    ctx.fillStyle = grad;
    ctx.fillRect(n.x - n.radius, n.y - n.radius, n.radius * 2, n.radius * 2);
  }
  // Stars
  for (const s of stars) {
    const tw = s.layer === 2 ? (0.7 + 0.3 * Math.sin(s.twinkle)) : (s.layer === 1 ? (0.85 + 0.15 * Math.sin(s.twinkle)) : 1);
    ctx.globalAlpha = s.alpha * tw;
    ctx.fillStyle = s.color;
    ctx.fillRect(s.x, s.y, s.size, s.size);
    // Near-layer stars get a tiny glow cross
    if (s.layer === 2 && tw > 0.9) {
      ctx.globalAlpha = s.alpha * (tw - 0.9) * 3;
      ctx.fillRect(s.x - 1, s.y + s.size / 2 - 0.5, s.size + 2, 1);
      ctx.fillRect(s.x + s.size / 2 - 0.5, s.y - 1, 1, s.size + 2);
    }
  }
  ctx.globalAlpha = 1;
}

// --- Player ---
function createPlayer() {
  return {
    x: W / 2, y: H / 2,
    vx: 0, vy: 0,
    angle: -Math.PI / 2,
    radius: 12,
    hitRadius: 8,
    afterburnerActive: false,
    afterburnerTimer: 0,
    afterburnerCooldown: 0,
    invincible: false,
    invincibleTimer: 0,
    blinkOn: true,
    decoyCooldown: 0,
  };
}

function updatePlayer() {
  const p = player;
  let ax = 0, ay = 0;
  if (keys['ArrowLeft'] || keys['KeyA']) ax -= 1;
  if (keys['ArrowRight'] || keys['KeyD']) ax += 1;
  if (keys['ArrowUp'] || keys['KeyW']) ay -= 1;
  if (keys['ArrowDown'] || keys['KeyS']) ay += 1;

  // Touch joystick input
  if (touch.joystick.active) {
    ax += touch.joystick.dx;
    ay += touch.joystick.dy;
  }

  // Normalize diagonal
  const alen = Math.sqrt(ax * ax + ay * ay);
  if (alen > 1) { ax /= alen; ay /= alen; }

  let accel = PLAYER_ACCEL;
  let maxSpd = PLAYER_MAX_SPEED;

  // Afterburner
  if (keys['Space'] && p.afterburnerCooldown <= 0 && !p.afterburnerActive) {
    p.afterburnerActive = true;
    p.afterburnerTimer = AFTERBURNER_DURATION;
  }
  if (p.afterburnerActive) {
    p.afterburnerTimer -= dt * 1000;
    maxSpd *= AFTERBURNER_MULT;
    accel *= 1.5;
    if (p.afterburnerTimer <= 0) {
      p.afterburnerActive = false;
      p.afterburnerCooldown = AFTERBURNER_COOLDOWN;
    }
  }
  if (p.afterburnerCooldown > 0) p.afterburnerCooldown -= dt * 1000;

  // Decoy
  if (keys['KeyF'] && p.decoyCooldown <= 0 && !activeDecoy) {
    activeDecoy = { x: p.x, y: p.y, life: DECOY_DURATION };
    p.decoyCooldown = DECOY_COOLDOWN;
    // Spawn burst of magenta particles
    for (let i = 0; i < 15; i++) {
      const a = Math.random() * Math.PI * 2;
      const spd2 = Math.random() * 2.5 + 0.5;
      particles.push({
        x: p.x, y: p.y,
        vx: Math.cos(a) * spd2, vy: Math.sin(a) * spd2,
        life: 500 + Math.random() * 300, maxLife: 800,
        color: i < 5 ? '#ffffff' : COLORS.decoy,
        size: Math.random() * 3 + 2,
      });
    }
  }
  if (p.decoyCooldown > 0) p.decoyCooldown -= dt * 1000;

  p.vx += ax * accel * dt * 60;
  p.vy += ay * accel * dt * 60;
  p.vx *= Math.pow(FRICTION, dt * 60);
  p.vy *= Math.pow(FRICTION, dt * 60);

  const spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
  if (spd > maxSpd) { p.vx = (p.vx / spd) * maxSpd; p.vy = (p.vy / spd) * maxSpd; }

  p.x += p.vx * dt * 60;
  p.y += p.vy * dt * 60;

  // Boundary - soft bounce
  const margin = 10;
  if (p.x < margin) { p.x = margin; p.vx = Math.abs(p.vx) * 0.5; }
  if (p.x > W - margin) { p.x = W - margin; p.vx = -Math.abs(p.vx) * 0.5; }
  if (p.y < margin) { p.y = margin; p.vy = Math.abs(p.vy) * 0.5; }
  if (p.y > H - margin) { p.y = H - margin; p.vy = -Math.abs(p.vy) * 0.5; }

  // Rotation toward movement
  if (spd > 0.5) {
    const targetAngle = Math.atan2(p.vy, p.vx);
    let diff = targetAngle - p.angle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;
    p.angle += diff * 0.15 * dt * 60;
  }

  // Invincibility
  if (p.invincible) {
    p.invincibleTimer -= dt * 1000;
    p.blinkOn = Math.floor(p.invincibleTimer / 100) % 2 === 0;
    if (p.invincibleTimer <= 0) { p.invincible = false; p.blinkOn = true; }
  }

  // Engine trail particles
  if (spd > 1) {
    const trailCount = p.afterburnerActive ? 3 : 1;
    for (let i = 0; i < trailCount; i++) {
      particles.push({
        x: p.x - Math.cos(p.angle) * 14 + (Math.random() - 0.5) * 6,
        y: p.y - Math.sin(p.angle) * 14 + (Math.random() - 0.5) * 6,
        vx: -Math.cos(p.angle) * 1.5 + (Math.random() - 0.5) * 0.5,
        vy: -Math.sin(p.angle) * 1.5 + (Math.random() - 0.5) * 0.5,
        life: p.afterburnerActive ? 600 : 300,
        maxLife: p.afterburnerActive ? 600 : 300,
        color: p.afterburnerActive ? '#ffffff' : COLORS.player,
        size: p.afterburnerActive ? 4 : 2.5,
      });
    }
  }
}

function drawPlayer() {
  const p = player;
  if (p.invincible && !p.blinkOn) return;

  const tNow = Date.now() * 0.001;
  const spd = Math.sqrt(p.vx * p.vx + p.vy * p.vy);

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.angle);

  // Afterburner flame (behind the jet)
  if (p.afterburnerActive) {
    const flick = 0.85 + Math.random() * 0.3;
    const flen = (18 + spd * 1.6) * flick;
    // Outer orange
    ctx.shadowColor = '#ff8822';
    ctx.shadowBlur = 18;
    ctx.fillStyle = 'rgba(255,120,30,0.85)';
    ctx.beginPath();
    ctx.moveTo(-8, -6);
    ctx.lineTo(-8 - flen, 0);
    ctx.lineTo(-8, 6);
    ctx.closePath();
    ctx.fill();
    // Mid yellow
    ctx.fillStyle = 'rgba(255,220,80,0.9)';
    ctx.beginPath();
    ctx.moveTo(-8, -4);
    ctx.lineTo(-8 - flen * 0.7, 0);
    ctx.lineTo(-8, 4);
    ctx.closePath();
    ctx.fill();
    // Inner white-hot
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(-8, -2);
    ctx.lineTo(-8 - flen * 0.4, 0);
    ctx.lineTo(-8, 2);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Glow
  ctx.shadowColor = COLORS.player;
  ctx.shadowBlur = 15;

  // Body (triangle)
  ctx.fillStyle = COLORS.player;
  ctx.beginPath();
  ctx.moveTo(16, 0);
  ctx.lineTo(-10, -9);
  ctx.lineTo(-6, 0);
  ctx.lineTo(-10, 9);
  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur = 0;

  // Wing details
  ctx.strokeStyle = '#00c8dd';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(10, 0);
  ctx.lineTo(-6, -7);
  ctx.moveTo(10, 0);
  ctx.lineTo(-6, 7);
  ctx.stroke();

  // Cockpit canopy (small dark ellipse with white spec highlight)
  ctx.fillStyle = 'rgba(10,30,50,0.8)';
  ctx.beginPath();
  ctx.ellipse(4, 0, 4, 2.4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(5, -0.5, 0.9, 0, Math.PI * 2);
  ctx.fill();

  // Wing-tip running lights (pulse)
  const lightPulse = 0.5 + 0.5 * Math.sin(tNow * 4);
  ctx.shadowColor = '#ffffff';
  ctx.shadowBlur = 6 + 4 * lightPulse;
  ctx.fillStyle = `rgba(255,255,255,${0.55 + 0.35 * lightPulse})`;
  ctx.beginPath();
  ctx.arc(-10, -9, 1.4, 0, Math.PI * 2);
  ctx.arc(-10, 9, 1.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.restore();
}

// --- Enemy ---
function spawnEnemy(type) {
  const side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0) { x = -30; y = Math.random() * H; }
  else if (side === 1) { x = W + 30; y = Math.random() * H; }
  else if (side === 2) { x = Math.random() * W; y = -30; }
  else { x = Math.random() * W; y = H + 30; }

  let hp, fireRate, speed, engagementRange, radius, missileType, missileCount;
  if (type === 'scout') {
    hp = 1; fireRate = 4000; speed = 2.5; engagementRange = 300; radius = 10; missileType = 'slow'; missileCount = 1;
  } else if (type === 'gunship') {
    hp = 2; fireRate = 3000; speed = 1.8; engagementRange = 250; radius = 14; missileType = 'medium'; missileCount = 1;
  } else {
    hp = 3; fireRate = 5000; speed = 1.3; engagementRange = 350; radius = 20; missileType = 'fast'; missileCount = 2;
  }

  enemies.push({
    type, x, y,
    vx: 0, vy: 0,
    angle: 0,
    speed, hp, maxHp: hp,
    fireRate,
    fireTimer: fireRate * 0.5 + Math.random() * fireRate * 0.5,
    engagementRange,
    radius,
    hitRadius: radius * 0.8,
    missileType, missileCount,
    alive: true,
    strafeAngle: Math.random() * Math.PI * 2,
  });
}

function updateEnemies() {
  for (const e of enemies) {
    const dx = player.x - e.x;
    const dy = player.y - e.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const toPlayerAngle = Math.atan2(dy, dx);

    if (e.type === 'scout') {
      if (dist > e.engagementRange + 50) {
        // Close in
        e.vx += Math.cos(toPlayerAngle) * 0.15 * dt * 60;
        e.vy += Math.sin(toPlayerAngle) * 0.15 * dt * 60;
      } else if (dist < e.engagementRange - 50) {
        // Back off slightly + strafe
        e.vx -= Math.cos(toPlayerAngle) * 0.05 * dt * 60;
        e.vy -= Math.sin(toPlayerAngle) * 0.05 * dt * 60;
        e.strafeAngle += 0.03 * dt * 60;
        e.vx += Math.cos(toPlayerAngle + Math.PI / 2) * 0.12 * dt * 60;
        e.vy += Math.sin(toPlayerAngle + Math.PI / 2) * 0.12 * dt * 60;
      } else {
        // Strafe/orbit
        e.strafeAngle += 0.02 * dt * 60;
        e.vx += Math.cos(toPlayerAngle + Math.PI / 2) * 0.15 * dt * 60;
        e.vy += Math.sin(toPlayerAngle + Math.PI / 2) * 0.15 * dt * 60;
      }
    } else if (e.type === 'gunship') {
      if (dist > e.engagementRange + 30) {
        e.vx += Math.cos(toPlayerAngle) * 0.12 * dt * 60;
        e.vy += Math.sin(toPlayerAngle) * 0.12 * dt * 60;
      } else if (dist < e.engagementRange - 50) {
        e.vx -= Math.cos(toPlayerAngle) * 0.1 * dt * 60;
        e.vy -= Math.sin(toPlayerAngle) * 0.1 * dt * 60;
      } else {
        e.strafeAngle += 0.025 * dt * 60;
        e.vx += Math.cos(toPlayerAngle + Math.PI / 2) * 0.1 * dt * 60;
        e.vy += Math.sin(toPlayerAngle + Math.PI / 2) * 0.1 * dt * 60;
      }
    } else { // bomber
      if (dist > e.engagementRange + 80) {
        e.vx += Math.cos(toPlayerAngle) * 0.08 * dt * 60;
        e.vy += Math.sin(toPlayerAngle) * 0.08 * dt * 60;
      } else {
        // Slow passes, curving toward player
        e.strafeAngle += 0.015 * dt * 60;
        e.vx += Math.cos(toPlayerAngle + Math.PI * 0.4) * 0.06 * dt * 60;
        e.vy += Math.sin(toPlayerAngle + Math.PI * 0.4) * 0.06 * dt * 60;
        e.vx += Math.cos(toPlayerAngle) * 0.03 * dt * 60;
        e.vy += Math.sin(toPlayerAngle) * 0.03 * dt * 60;
      }
    }

    // Speed cap
    const spd = Math.sqrt(e.vx * e.vx + e.vy * e.vy);
    if (spd > e.speed) { e.vx = (e.vx / spd) * e.speed; e.vy = (e.vy / spd) * e.speed; }

    // Friction
    e.vx *= Math.pow(0.99, dt * 60);
    e.vy *= Math.pow(0.99, dt * 60);

    e.x += e.vx * dt * 60;
    e.y += e.vy * dt * 60;

    // Keep in bounds (curve back)
    const bm = 50;
    if (e.x < -bm) e.vx += 0.3 * dt * 60;
    if (e.x > W + bm) e.vx -= 0.3 * dt * 60;
    if (e.y < -bm) e.vy += 0.3 * dt * 60;
    if (e.y > H + bm) e.vy -= 0.3 * dt * 60;

    // Face movement direction
    if (spd > 0.3) {
      const tAngle = Math.atan2(e.vy, e.vx);
      let diff = tAngle - e.angle;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      e.angle += diff * 0.1 * dt * 60;
    }

    // Fire missiles
    e.fireTimer -= dt * 1000;
    if (e.fireTimer <= 0 && dist < 500 && !inBreather) {
      e.fireTimer = e.fireRate;
      fireMissile(e);
    }

    // Engine trail
    if (spd > 0.5 && Math.random() < 0.3) {
      particles.push({
        x: e.x - Math.cos(e.angle) * e.radius + (Math.random() - 0.5) * 4,
        y: e.y - Math.sin(e.angle) * e.radius + (Math.random() - 0.5) * 4,
        vx: -Math.cos(e.angle) * 0.8,
        vy: -Math.sin(e.angle) * 0.8,
        life: 200, maxLife: 200,
        color: '#ff6633',
        size: 2,
      });
    }
  }
}

function drawEnemy(e) {
  const tNow = Date.now() * 0.001;

  let color, glowColor, darkColor;
  if (e.type === 'scout') { color = COLORS.enemy; glowColor = '#ff6644'; darkColor = '#7a1a15'; }
  else if (e.type === 'gunship') { color = COLORS.enemyGunship; glowColor = '#ff4422'; darkColor = '#5a0d0d'; }
  else { color = COLORS.enemyBomber; glowColor = '#cc3333'; darkColor = '#3d0808'; }

  // Exhaust glow behind the ship (in world space, not rotated)
  const exhaustX = e.x - Math.cos(e.angle) * (e.radius + 4);
  const exhaustY = e.y - Math.sin(e.angle) * (e.radius + 4);
  const exGrad = ctx.createRadialGradient(exhaustX, exhaustY, 0, exhaustX, exhaustY, e.radius);
  exGrad.addColorStop(0, glowColor.replace(')', '') + ''); // base
  // Use rgba form directly
  const rgbaGlow = e.type === 'scout' ? 'rgba(255,102,68,' : e.type === 'gunship' ? 'rgba(255,68,34,' : 'rgba(204,51,51,';
  exGrad.addColorStop(0, rgbaGlow + '0.5)');
  exGrad.addColorStop(1, rgbaGlow + '0)');
  ctx.fillStyle = exGrad;
  ctx.fillRect(exhaustX - e.radius, exhaustY - e.radius, e.radius * 2, e.radius * 2);

  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.rotate(e.angle);

  ctx.shadowColor = glowColor;
  ctx.shadowBlur = 10;
  ctx.fillStyle = color;

  if (e.type === 'scout') {
    // Main body
    ctx.beginPath();
    ctx.moveTo(12, 0);
    ctx.lineTo(-8, -7);
    ctx.lineTo(-4, 0);
    ctx.lineTo(-8, 7);
    ctx.closePath();
    ctx.fill();

    ctx.shadowBlur = 0;

    // Swept wing-tips
    ctx.fillStyle = darkColor;
    ctx.beginPath();
    ctx.moveTo(-2, -6); ctx.lineTo(-9, -10); ctx.lineTo(-6, -6); ctx.closePath();
    ctx.moveTo(-2, 6); ctx.lineTo(-9, 10); ctx.lineTo(-6, 6); ctx.closePath();
    ctx.fill();

    // Tail light (slow blink)
    const blinkA = 0.6 + 0.4 * Math.sin(tNow * 3);
    ctx.fillStyle = `rgba(255,80,60,${blinkA.toFixed(2)})`;
    ctx.shadowColor = '#ff5544'; ctx.shadowBlur = 5;
    ctx.beginPath();
    ctx.arc(-7, 0, 1.3, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Nose highlight
    ctx.fillStyle = '#ffaa88';
    ctx.fillRect(10, -0.5, 2, 1);
  } else if (e.type === 'gunship') {
    // Main body
    ctx.beginPath();
    ctx.moveTo(16, 0);
    ctx.lineTo(-10, -10);
    ctx.lineTo(-6, 0);
    ctx.lineTo(-10, 10);
    ctx.closePath();
    ctx.fill();

    ctx.shadowBlur = 0;

    // Turret
    ctx.fillStyle = '#ff5544';
    ctx.fillRect(-2, -3, 8, 6);

    // Canopy (dark ellipse)
    ctx.fillStyle = darkColor;
    ctx.beginPath();
    ctx.ellipse(3, 0, 4, 2.5, 0, 0, Math.PI * 2);
    ctx.fill();

    // Twin engine glow dots at rear
    const ePulse = 0.7 + 0.3 * Math.sin(tNow * 6);
    ctx.shadowColor = '#ff8844'; ctx.shadowBlur = 6;
    ctx.fillStyle = `rgba(255,180,100,${ePulse.toFixed(2)})`;
    ctx.beginPath();
    ctx.arc(-9, -4, 1.4, 0, Math.PI * 2);
    ctx.arc(-9, 4, 1.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
  } else {
    // Bomber main body
    ctx.beginPath();
    ctx.moveTo(22, 0);
    ctx.lineTo(-14, -14);
    ctx.lineTo(-8, -5);
    ctx.lineTo(-10, 0);
    ctx.lineTo(-8, 5);
    ctx.lineTo(-14, 14);
    ctx.closePath();
    ctx.fill();

    ctx.shadowBlur = 0;

    // Darker central spine for depth
    ctx.fillStyle = darkColor;
    ctx.beginPath();
    ctx.moveTo(18, 0);
    ctx.lineTo(-8, -3);
    ctx.lineTo(-10, 0);
    ctx.lineTo(-8, 3);
    ctx.closePath();
    ctx.fill();

    // Wing hardpoints (4 dots)
    ctx.fillStyle = '#2a0505';
    ctx.fillRect(-4, -11, 2, 2);
    ctx.fillRect(-8, -13, 2, 2);
    ctx.fillRect(-4, 9, 2, 2);
    ctx.fillRect(-8, 11, 2, 2);

    // Slow blinking belly light
    const bellyBlink = Math.sin(tNow * 2) > 0.3 ? 1 : 0.2;
    ctx.fillStyle = `rgba(255,60,60,${bellyBlink.toFixed(2)})`;
    ctx.shadowColor = '#ff3333'; ctx.shadowBlur = 6 * bellyBlink;
    ctx.beginPath();
    ctx.arc(2, 0, 1.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Cockpit
    ctx.fillStyle = 'rgba(20,5,5,0.8)';
    ctx.beginPath();
    ctx.ellipse(12, 0, 4, 2.5, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.shadowBlur = 0;
  ctx.restore();

  // HP bar for multi-hit enemies
  if (e.maxHp > 1) {
    const bw = e.radius * 2;
    const bh = 3;
    ctx.fillStyle = 'rgba(30,10,10,0.7)';
    ctx.fillRect(e.x - bw / 2, e.y - e.radius - 8, bw, bh);
    ctx.fillStyle = '#ff3333';
    ctx.fillRect(e.x - bw / 2, e.y - e.radius - 8, bw * (e.hp / e.maxHp), bh);
    // Subtle border
    ctx.strokeStyle = 'rgba(255,80,80,0.4)';
    ctx.lineWidth = 0.5;
    ctx.strokeRect(e.x - bw / 2, e.y - e.radius - 8, bw, bh);
  }
}

// --- Missiles ---
function fireMissile(enemy) {
  const angleToPlayer = Math.atan2(player.y - enemy.y, player.x - enemy.x);
  const count = enemy.missileCount;
  for (let i = 0; i < count; i++) {
    let a = angleToPlayer;
    if (count === 2) a += (i === 0 ? -0.15 : 0.15);

    let speed, turnRate;
    if (enemy.missileType === 'slow') { speed = PLAYER_MAX_SPEED * 0.975; turnRate = 0.025; }
    else if (enemy.missileType === 'medium') { speed = PLAYER_MAX_SPEED * 1.0125; turnRate = 0.04; }
    else { speed = PLAYER_MAX_SPEED * 1.125; turnRate = 0.025; }

    // Difficulty scaling
    speed *= GAME_SETTINGS.missileSpeedMult;

    // Wave scaling
    const waveSpeedMult = 1 + Math.min(wave, 10) * 0.02;
    speed *= waveSpeedMult;

    missiles.push({
      x: enemy.x + Math.cos(a) * (enemy.radius + 5),
      y: enemy.y + Math.sin(a) * (enemy.radius + 5),
      vx: Math.cos(a) * speed,
      vy: Math.sin(a) * speed,
      speed,
      turnRate,
      angle: a,
      radius: 4,
      hitRadius: 4,
      life: MISSILE_LIFETIME,
      alive: true,
      firedBy: enemy,
      trail: [],
      nearMissTriggered: false,
    });
  }
}

function updateDecoy() {
  if (!activeDecoy) return;
  activeDecoy.life -= dt * 1000;
  // Spawn pulsing glow particles
  if (Math.random() < 0.6) {
    const a = Math.random() * Math.PI * 2;
    const spd = Math.random() * 0.8;
    particles.push({
      x: activeDecoy.x + (Math.random() - 0.5) * 10,
      y: activeDecoy.y + (Math.random() - 0.5) * 10,
      vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      life: 300 + Math.random() * 200, maxLife: 500,
      color: Math.random() < 0.3 ? '#ffffff' : COLORS.decoy,
      size: Math.random() * 3 + 1,
    });
  }
  if (activeDecoy.life <= 0) {
    // Fadeout burst
    for (let i = 0; i < 8; i++) {
      const a = Math.random() * Math.PI * 2;
      particles.push({
        x: activeDecoy.x, y: activeDecoy.y,
        vx: Math.cos(a) * 1.5, vy: Math.sin(a) * 1.5,
        life: 300, maxLife: 300,
        color: COLORS.decoy, size: 2,
      });
    }
    activeDecoy = null;
  }
}

function updateHeartPickup() {
  // Spawn timer
  if (!heartPickup) {
    heartSpawnTimer -= dt * 1000;
    if (heartSpawnTimer <= 0) {
      const margin = 60;
      heartPickup = {
        x: margin + Math.random() * (W - margin * 2),
        y: margin + Math.random() * (H - margin * 2),
        life: HEART_DURATION,
      };
    }
  }
  if (!heartPickup) return;

  heartPickup.life -= dt * 1000;

  // Check player collection
  const dx = player.x - heartPickup.x;
  const dy = player.y - heartPickup.y;
  if (Math.sqrt(dx * dx + dy * dy) < HEART_PICKUP_RADIUS + player.hitRadius) {
    lives++;
    // Celebration particles
    for (let i = 0; i < 12; i++) {
      const a = Math.random() * Math.PI * 2;
      particles.push({
        x: heartPickup.x, y: heartPickup.y,
        vx: Math.cos(a) * 2, vy: Math.sin(a) * 2,
        life: 500, maxLife: 500,
        color: i < 4 ? '#ffffff' : '#ff4466',
        size: Math.random() * 3 + 2,
      });
    }
    textPopups.push({ x: heartPickup.x, y: heartPickup.y - 15, text: '+1 LIFE', color: '#ff4466', life: 1200, maxLife: 1200 });
    heartPickup = null;
    heartSpawnTimer = HEART_SPAWN_INTERVAL;
    return;
  }

  // Expire
  if (heartPickup.life <= 0) {
    heartPickup = null;
    heartSpawnTimer = HEART_SPAWN_INTERVAL;
  }
}

function drawHeart(x, y, size) {
  ctx.beginPath();
  const topY = y - size * 0.4;
  ctx.moveTo(x, y + size * 0.6);
  ctx.bezierCurveTo(x - size, y - size * 0.2, x - size * 0.5, topY - size * 0.5, x, topY + size * 0.1);
  ctx.bezierCurveTo(x + size * 0.5, topY - size * 0.5, x + size, y - size * 0.2, x, y + size * 0.6);
  ctx.closePath();
}

function updateMissiles() {
  for (const m of missiles) {
    m.life -= dt * 1000;
    if (m.life <= 0) { m.alive = false; continue; }

    // Determine tracking target (decoy if active and in range, otherwise player)
    let targetX = player.x, targetY = player.y;
    let trackingDecoy = false;
    if (activeDecoy) {
      const fdx = activeDecoy.x - m.x;
      const fdy = activeDecoy.y - m.y;
      const fDist = Math.sqrt(fdx * fdx + fdy * fdy);
      if (fDist < DECOY_ATTRACT_RADIUS) {
        targetX = activeDecoy.x;
        targetY = activeDecoy.y;
        trackingDecoy = true;
        // Missile reaches decoy — destroy missile
        if (fDist < 15) {
          m.alive = false;
          spawnSpark(m.x, m.y);
          continue;
        }
      }
    }

    const dx = targetX - m.x;
    const dy = targetY - m.y;
    const targetAngle = Math.atan2(dy, dx);
    let diff = targetAngle - m.angle;
    while (diff > Math.PI) diff -= Math.PI * 2;
    while (diff < -Math.PI) diff += Math.PI * 2;

    let tr = m.turnRate;
    // Boost turn rate after 8 seconds
    const elapsed = MISSILE_LIFETIME - m.life;
    if (elapsed > MISSILE_BOOST_TIME) tr *= 1.5;

    m.angle += Math.sign(diff) * Math.min(Math.abs(diff), tr * dt * 60);

    // Deflection toward nearby enemies — if missile passes close to an enemy, bend toward it
    const DEFLECT_RADIUS = GAME_SETTINGS.deflectRadius;
    const DEFLECT_STRENGTH = GAME_SETTINGS.deflectStrength;
    for (const e of enemies) {
      if (!e.alive) continue;
      const edx = e.x - m.x;
      const edy = e.y - m.y;
      const eDist = Math.sqrt(edx * edx + edy * edy);
      if (eDist < DEFLECT_RADIUS && eDist > e.hitRadius) {
        const toEnemyAngle = Math.atan2(edy, edx);
        let eDiff = toEnemyAngle - m.angle;
        while (eDiff > Math.PI) eDiff -= Math.PI * 2;
        while (eDiff < -Math.PI) eDiff += Math.PI * 2;
        // Stronger pull the closer the missile is
        const pull = DEFLECT_STRENGTH * (1 - eDist / DEFLECT_RADIUS) * dt * 60;
        m.angle += Math.sign(eDiff) * Math.min(Math.abs(eDiff), pull);
      }
    }

    m.vx = Math.cos(m.angle) * m.speed;
    m.vy = Math.sin(m.angle) * m.speed;

    m.x += m.vx * dt * 60;
    m.y += m.vy * dt * 60;

    // Bounce off arena edges
    if (m.x < 0) { m.x = 0; m.vx = Math.abs(m.vx); m.angle = Math.atan2(m.vy, m.vx); spawnSpark(m.x, m.y); }
    if (m.x > W) { m.x = W; m.vx = -Math.abs(m.vx); m.angle = Math.atan2(m.vy, m.vx); spawnSpark(m.x, m.y); }
    if (m.y < 0) { m.y = 0; m.vy = Math.abs(m.vy); m.angle = Math.atan2(m.vy, m.vx); spawnSpark(m.x, m.y); }
    if (m.y > H) { m.y = H; m.vy = -Math.abs(m.vy); m.angle = Math.atan2(m.vy, m.vx); spawnSpark(m.x, m.y); }

    // Trail
    m.trail.push({ x: m.x, y: m.y });
    if (m.trail.length > 30) m.trail.shift();

    // Trail particles
    if (Math.random() < 0.4) {
      particles.push({
        x: m.x + (Math.random() - 0.5) * 3,
        y: m.y + (Math.random() - 0.5) * 3,
        vx: -m.vx * 0.05 + (Math.random() - 0.5) * 0.3,
        vy: -m.vy * 0.05 + (Math.random() - 0.5) * 0.3,
        life: 400, maxLife: 400,
        color: COLORS.missileTrail,
        size: 2,
      });
    }

    // Near miss check
    if (!m.nearMissTriggered && !player.invincible) {
      const pd = Math.sqrt((m.x - player.x) ** 2 + (m.y - player.y) ** 2);
      if (pd < NEAR_MISS_DIST + player.hitRadius && pd > player.hitRadius) {
        m.nearMissTriggered = true;
        score += 25;
        textPopups.push({ x: player.x, y: player.y - 20, text: 'CLOSE!', life: 800, maxLife: 800, color: '#ff88ff', size: 16 });
      }
    }
  }
}

function drawMissile(m) {
  const tNow = Date.now() * 0.001;
  const missileAge = MISSILE_LIFETIME - m.life;
  const armed = missileAge >= 3000;

  // Trail — tapered width + color gradient
  const trailLen = m.trail.length;
  if (trailLen > 1) {
    for (let i = 1; i < trailLen; i++) {
      const t = i / trailLen;
      const alpha = t * 0.6;
      // Blend red-orange → yellow-white toward the nose
      const r = Math.round(255);
      const g = Math.round(140 + t * 100);
      const b = Math.round(30 + t * 80);
      ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
      ctx.lineWidth = 0.5 + t * 2.2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(m.trail[i - 1].x, m.trail[i - 1].y);
      ctx.lineTo(m.trail[i].x, m.trail[i].y);
      ctx.stroke();
    }
    ctx.lineCap = 'butt';
  }

  // Pulsing halo around the missile
  const haloAlpha = armed ? (0.25 + 0.15 * Math.sin(tNow * 10 + m.x * 0.01)) : 0.1;
  const haloGrad = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, 14);
  haloGrad.addColorStop(0, armed ? `rgba(255,230,90,${haloAlpha})` : `rgba(160,180,200,${haloAlpha})`);
  haloGrad.addColorStop(1, 'rgba(255,230,90,0)');
  ctx.fillStyle = haloGrad;
  ctx.fillRect(m.x - 14, m.y - 14, 28, 28);

  // Missile body (layered)
  ctx.save();
  ctx.translate(m.x, m.y);
  ctx.rotate(m.angle);

  // Rear fin flares (small triangles)
  ctx.fillStyle = armed ? '#aa5500' : '#556070';
  ctx.beginPath();
  ctx.moveTo(-4, -3); ctx.lineTo(-6, -5); ctx.lineTo(-3, -1.5); ctx.closePath();
  ctx.moveTo(-4, 3); ctx.lineTo(-6, 5); ctx.lineTo(-3, 1.5); ctx.closePath();
  ctx.fill();

  // Body
  ctx.shadowColor = armed ? COLORS.missile : '#aab0c0';
  ctx.shadowBlur = armed ? 8 : 4;
  ctx.fillStyle = armed ? COLORS.missile : '#9aa3b8';
  ctx.beginPath();
  ctx.moveTo(6, 0);
  ctx.lineTo(-4, -3);
  ctx.lineTo(-4, 3);
  ctx.closePath();
  ctx.fill();

  // Bright nose dot
  ctx.shadowBlur = armed ? 6 : 0;
  ctx.fillStyle = armed ? '#ffffff' : '#d0d6e0';
  ctx.beginPath();
  ctx.arc(5, 0, 1.2, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.restore();
}

// --- Collision ---
function checkCollisions() {
  for (const m of missiles) {
    if (!m.alive) continue;

    // Missile → Player
    if (!player.invincible) {
      const pd = Math.sqrt((m.x - player.x) ** 2 + (m.y - player.y) ** 2);
      if (pd < m.hitRadius + player.hitRadius) {
        m.alive = false;
        hitPlayer();
        continue;
      }
    }

    // Missile → Enemy (3-second grace period after firing)
    const missileAge = MISSILE_LIFETIME - m.life;
    if (missileAge >= 3000) for (const e of enemies) {
      if (!e.alive) continue;
      const ed = Math.sqrt((m.x - e.x) ** 2 + (m.y - e.y) ** 2);
      if (ed < m.hitRadius + e.hitRadius) {
        m.alive = false;
        e.hp--;
        if (e.hp <= 0) {
          e.alive = false;
          destroyEnemy(e, m);
        } else {
          // Hit flash
          spawnExplosion(e.x, e.y, 5, '#ff8844');
        }
        break;
      }
    }
  }
}

function hitPlayer() {
  lives--;
  spawnExplosion(player.x, player.y, 25, COLORS.player);
  triggerShake(5, 300);

  if (lives <= 0) {
    gameOver();
    return;
  }

  player.x = W / 2;
  player.y = H / 2;
  player.vx = 0;
  player.vy = 0;
  player.invincible = true;
  player.invincibleTimer = INVINCIBILITY_DURATION;
}

function destroyEnemy(e, missile) {
  const size = e.type === 'bomber' ? 35 : e.type === 'gunship' ? 25 : 18;
  const color = e.type === 'bomber' ? '#ff4422' : e.type === 'gunship' ? '#ff6644' : COLORS.enemy;
  spawnExplosion(e.x, e.y, size, color);
  triggerShake(e.type === 'bomber' ? 6 : e.type === 'gunship' ? 4 : 3, e.type === 'bomber' ? 300 : 200);

  enemiesDestroyed++;

  // Score
  let base = e.type === 'scout' ? 100 : e.type === 'gunship' ? 250 : 500;
  let bonus = 0;
  if (missile.firedBy === e) { bonus = 50; textPopups.push({ x: e.x, y: e.y - 30, text: 'REDIRECT!', life: 1000, maxLife: 1000, color: '#ffcc00', size: 18 }); }

  // Combo
  if (comboTimer > 0) {
    combo++;
    comboMultiplier = Math.min(combo + 1, 5);
  } else {
    combo = 0;
    comboMultiplier = 1;
  }
  comboTimer = COMBO_WINDOW;
  if (comboMultiplier > highestCombo) highestCombo = comboMultiplier;

  const points = Math.floor((base + bonus) * comboMultiplier * GAME_SETTINGS.scoreMultiplier);
  score += points;

  textPopups.push({ x: e.x, y: e.y - 10, text: `+${points}`, life: 1000, maxLife: 1000, color: comboMultiplier > 1 ? COLORS.combo : '#ffffff', size: comboMultiplier > 1 ? 20 : 14 });
}

// --- Effects ---
function spawnExplosion(x, y, count, color) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = Math.random() * 3 + 1;
    particles.push({
      x, y,
      vx: Math.cos(a) * spd,
      vy: Math.sin(a) * spd,
      life: 500 + Math.random() * 300,
      maxLife: 800,
      color: i < count / 3 ? '#ffffff' : i < count * 2 / 3 ? color : '#ff4400',
      size: Math.random() * 4 + 2,
      colorRamp: true,
    });
  }
  // Primary shock ring
  particles.push({
    x, y, vx: 0, vy: 0,
    life: 400, maxLife: 400,
    color: '#ffffff',
    size: 5, isRing: true, ringMax: count * 1.6 + 10,
  });
  // Secondary inner ring (delayed pulse feel via shorter life)
  particles.push({
    x, y, vx: 0, vy: 0,
    life: 300, maxLife: 300,
    color: color,
    size: 3, isRing: true, ringMax: count * 1.0 + 6, ringDelay: 100,
  });
  // Debris streaks for larger explosions
  if (count >= 15) {
    const streakCount = Math.min(8, Math.floor(count / 3));
    for (let i = 0; i < streakCount; i++) {
      const a = Math.random() * Math.PI * 2;
      const spd = 3 + Math.random() * 3;
      particles.push({
        x, y,
        vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
        life: 600, maxLife: 600,
        color: '#ffcc55',
        size: 2.5,
        isStreak: true, angle: a,
      });
    }
  }
}

function spawnSpark(x, y) {
  for (let i = 0; i < 4; i++) {
    const a = Math.random() * Math.PI * 2;
    particles.push({
      x, y,
      vx: Math.cos(a) * 2,
      vy: Math.sin(a) * 2,
      life: 200, maxLife: 200,
      color: '#ffdd44',
      size: 2,
    });
  }
}

function triggerShake(intensity, duration) {
  shakeIntensity = intensity;
  shakeTimer = duration;
}

function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt * 1000;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.x += (p.vx || 0) * dt * 60;
    p.y += (p.vy || 0) * dt * 60;
    if (p.vx) p.vx *= 0.98;
    if (p.vy) p.vy *= 0.98;
  }
  // Cap particles
  if (particles.length > 200) particles.splice(0, particles.length - 200);
}

function drawParticles() {
  for (const p of particles) {
    const alpha = Math.max(0, p.life / p.maxLife);
    ctx.globalAlpha = alpha;

    if (p.isRing) {
      const progress = 1 - p.life / p.maxLife;
      const maxR = p.ringMax || 40;
      const ringRadius = progress * maxR;
      ctx.strokeStyle = p.color;
      ctx.lineWidth = Math.max(0.5, 3 * (1 - progress));
      ctx.beginPath();
      ctx.arc(p.x, p.y, ringRadius, 0, Math.PI * 2);
      ctx.stroke();
    } else if (p.isStreak) {
      // Motion-blur streak behind the particle
      const len = 10 + (1 - alpha) * 14;
      const tx = p.x - Math.cos(p.angle) * len;
      const ty = p.y - Math.sin(p.angle) * len;
      const strGrad = ctx.createLinearGradient(p.x, p.y, tx, ty);
      strGrad.addColorStop(0, `rgba(255,210,100,${alpha})`);
      strGrad.addColorStop(1, 'rgba(255,80,0,0)');
      ctx.strokeStyle = strGrad;
      ctx.lineWidth = p.size * alpha;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(tx, ty);
      ctx.stroke();
      ctx.lineCap = 'butt';
    } else {
      // Color ramp for explosion particles: white → yellow → orange → red as it dies
      let col = p.color;
      if (p.colorRamp) {
        if (alpha > 0.7) col = '#ffffff';
        else if (alpha > 0.45) col = '#ffdd66';
        else if (alpha > 0.2) col = '#ff8833';
        else col = '#ff3322';
      }
      ctx.fillStyle = col;
      const s = p.size * alpha;
      ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
    }
  }
  ctx.globalAlpha = 1;
}

function updateTextPopups() {
  for (let i = textPopups.length - 1; i >= 0; i--) {
    const t = textPopups[i];
    t.life -= dt * 1000;
    t.y -= 0.8 * dt * 60;
    if (t.life <= 0) textPopups.splice(i, 1);
  }
}

function drawTextPopups() {
  for (const t of textPopups) {
    const alpha = Math.max(0, t.life / t.maxLife);
    const age = t.maxLife - t.life;
    // Scale curve: pop to 1.3 in first 150ms, settle to 1.0, slight shrink at end
    let scale;
    if (age < 150) scale = 1 + (age / 150) * 0.3;
    else if (age < 300) scale = 1.3 - ((age - 150) / 150) * 0.3;
    else scale = Math.max(0.7, 1.0 - (1 - alpha) * 0.3);

    const baseSize = t.size || 14;
    const sz = Math.max(8, Math.floor(baseSize * scale));

    ctx.globalAlpha = alpha;
    ctx.font = `bold ${sz}px monospace`;
    ctx.textAlign = 'center';
    ctx.shadowColor = t.color;
    ctx.shadowBlur = 8;
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
    ctx.shadowBlur = 0;

    // Combo starburst flash on spawn
    if (t.color === '#ffd700' || (t.text && t.text.startsWith('+') && baseSize >= 18)) {
      if (age < 250) {
        const burstAlpha = (1 - age / 250) * 0.8;
        ctx.strokeStyle = `rgba(255,230,120,${burstAlpha})`;
        ctx.lineWidth = 1.5;
        const len = 10 + age * 0.08;
        ctx.save();
        ctx.translate(t.x, t.y - 6);
        for (let i = 0; i < 4; i++) {
          ctx.rotate(Math.PI / 2);
          ctx.beginPath();
          ctx.moveTo(6, 0); ctx.lineTo(6 + len, 0);
          ctx.stroke();
        }
        ctx.restore();
      }
    }
  }
  ctx.globalAlpha = 1;
}

// --- Waves ---
function updateWaves() {
  if (inBreather) {
    waveBreatherTimer -= dt * 1000;
    if (waveBreatherTimer <= 0) {
      inBreather = false;
      spawnWave();
    }
    return;
  }

  const allEnemiesDead = enemies.length > 0 && enemies.filter(e => e.alive).length === 0;
  waveTimer -= dt * 1000;
  if ((waveTimer <= 0 || allEnemiesDead) && enemies.filter(e => e.alive).length === 0) {
    // Next wave
    inBreather = true;
    waveBreatherTimer = WAVE_BREATHER;
  } else if (waveTimer <= 0 && enemies.filter(e => e.alive).length > 0) {
    // Wait for remaining enemies but also allow next wave to start
    waveTimer = 3000;
  }
}

function spawnWave() {
  wave++;
  waveAnnounceTimer = 2000;

  let scouts = 0, gunships = 0, bombers = 0;
  if (wave === 1) { scouts = 2; }
  else if (wave === 2) { scouts = 3; }
  else if (wave === 3) { scouts = 2; gunships = 1; }
  else if (wave === 4) { scouts = 3; gunships = 1; }
  else if (wave === 5) { scouts = 2; gunships = 1; bombers = 1; }
  else {
    const extra = wave - 5;
    scouts = 2 + Math.floor(extra * 0.5);
    gunships = 1 + Math.floor(extra * 0.4);
    bombers = 1 + Math.floor(extra * 0.3);
    // Cap after wave 10
    if (wave > 10) {
      scouts = Math.min(scouts, 6);
      gunships = Math.min(gunships, 4);
      bombers = Math.min(bombers, 3);
    }
  }

  for (let i = 0; i < scouts; i++) spawnEnemy('scout');
  for (let i = 0; i < gunships; i++) spawnEnemy('gunship');
  for (let i = 0; i < bombers; i++) spawnEnemy('bomber');

  // Adjust fire rates based on wave
  const rateMultiplier = Math.max(0.6, 1 - (wave - 1) * 0.05);
  for (const e of enemies) {
    if (!e.alive) continue;
    e.fireRate *= rateMultiplier;
  }

  waveTimer = WAVE_DURATION;
}

// --- Name Entry & Leaderboard ---
const nameOverlay = document.getElementById('name-overlay');
const nameInput = document.getElementById('name-input');
const nameStartBtn = document.getElementById('name-start-btn');

// Prevent game keys from firing while typing
nameInput.addEventListener('keydown', e => {
  e.stopPropagation();
  if (e.key === 'Enter') { confirmName(); }
});
nameStartBtn.addEventListener('click', confirmName);

function showNameEntry() {
  state = 'NAME_ENTRY';
  nameInput.value = playerName;
  nameOverlay.classList.add('active');
  setTimeout(() => nameInput.focus(), 50);
}

function hideNameEntry() {
  nameOverlay.classList.remove('active');
}

function confirmName() {
  const val = nameInput.value.trim();
  if (val.length < 1 || val.length > 20 || !/^[a-zA-Z0-9 ]+$/.test(val)) return;
  playerName = val;
  localStorage.setItem('missileDodgePlayerName', playerName);
  hideNameEntry();
  startGame();
}

async function submitScore() {
  if (scoreSubmitted || !playerName) return;
  scoreSubmitted = true;
  try {
    const res = await fetch('/api/scores', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: playerName,
        score,
        enemiesDestroyed,
        highestCombo,
        wavesSurvived: wave,
      }),
    });
    const data = await res.json();
    if (data.rank) playerRank = data.rank;
  } catch (e) {
    playerRank = null;
  }
}

async function fetchLeaderboard() {
  leaderboardLoading = true;
  leaderboardData = null;
  try {
    const res = await fetch('/api/scores?limit=50');
    leaderboardData = await res.json();
  } catch (e) {
    leaderboardData = [];
  }
  leaderboardLoading = false;
}

function showLeaderboard() {
  state = 'LEADERBOARD';
  fetchLeaderboard();
}

// --- Game State ---
function startGame() {
  state = 'PLAYING';
  score = 0;
  highScore = getHighScore();
  lives = GAME_SETTINGS.lives;
  wave = 0;
  combo = 0;
  comboTimer = 0;
  comboMultiplier = 1;
  enemiesDestroyed = 0;
  highestCombo = 0;
  player = createPlayer();
  activeDecoy = null;
  heartPickup = null;
  heartSpawnTimer = HEART_SPAWN_INTERVAL;
  enemies = [];
  missiles = [];
  particles = [];
  textPopups = [];
  scoreSubmitted = false;
  playerRank = null;
  inBreather = true;
  waveBreatherTimer = 1000;
}

function gameOver() {
  state = 'GAME_OVER';
  if (score > highScore) {
    highScore = score;
    setHighScore(highScore);
  }
  submitScore();
}

// Helper: draw a small cooldown bar with glow + leading tick
function drawCooldownBar(x, y, w, h, pct, fillColor, bgRgba) {
  ctx.fillStyle = bgRgba;
  ctx.fillRect(x, y, w, h);
  // Fill
  ctx.fillStyle = fillColor;
  ctx.fillRect(x, y, w * pct, h);
  // Leading tick (brighter vertical line)
  if (pct > 0.02 && pct < 0.99) {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(x + w * pct - 1, y - 1, 2, h + 2);
  }
  // Outline
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.lineWidth = 0.5;
  ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
}

// --- HUD ---
function drawHUD() {
  const tNow = Date.now() * 0.001;

  // Score
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 8;
  ctx.fillStyle = COLORS.uiText;
  ctx.font = 'bold 30px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(score.toLocaleString(), 20, 42);

  // Small "SCORE" label above the score number
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(170,200,220,0.5)';
  ctx.font = 'bold 10px monospace';
  ctx.fillText('SCORE', 20, 18);

  // Combo
  if (comboTimer > 0 && comboMultiplier > 1) {
    const pulse = 1 + Math.sin(tNow * 10) * 0.1;
    // Combo timer bar (thin, fades as window closes)
    const ctPct = Math.max(0, comboTimer / COMBO_WINDOW);
    ctx.fillStyle = 'rgba(255,215,0,0.15)';
    ctx.fillRect(20, 52, 80, 3);
    ctx.fillStyle = COLORS.combo;
    ctx.fillRect(20, 52, 80 * ctPct, 3);
    // Combo multiplier text
    ctx.shadowColor = COLORS.combo;
    ctx.shadowBlur = 10 + 4 * Math.sin(tNow * 8);
    ctx.fillStyle = COLORS.combo;
    ctx.font = `bold ${Math.floor(22 * pulse)}px monospace`;
    ctx.fillText(`x${comboMultiplier}`, 20, 78);
    ctx.shadowBlur = 0;
  }

  // Lives — mini hearts
  const livesOffsetX = isTouchDevice ? 70 : 30;
  for (let i = 0; i < lives; i++) {
    const lx = W - livesOffsetX - i * 26;
    const ly = 30;
    ctx.shadowColor = '#ff4466';
    ctx.shadowBlur = 8;
    ctx.fillStyle = '#ff4466';
    drawHeart(lx, ly, 8);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffaabb';
    drawHeart(lx, ly, 4);
    ctx.fill();
  }

  // Wave
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 6;
  ctx.fillStyle = COLORS.uiText;
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(`WAVE ${wave}`, W - (isTouchDevice ? 60 : 20), 60);
  ctx.shadowBlur = 0;

  // Ability indicators (top-left, below combo)
  const abilityY = 105;
  ctx.textAlign = 'left';

  // Boost
  ctx.font = 'bold 13px monospace';
  const boostKey = isTouchDevice ? '' : '[SPACE] ';
  ctx.shadowColor = COLORS.player;
  ctx.shadowBlur = 4;
  if (player.afterburnerActive) {
    ctx.fillStyle = COLORS.player;
    ctx.shadowBlur = 10 + 5 * Math.sin(tNow * 15);
    ctx.fillText(boostKey + 'BOOST  ACTIVE', 20, abilityY);
  } else if (player.afterburnerCooldown > 0) {
    const pct = 1 - player.afterburnerCooldown / AFTERBURNER_COOLDOWN;
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#667788';
    ctx.fillText(boostKey + 'BOOST', 20, abilityY);
    const barX = boostKey ? 130 : 80;
    drawCooldownBar(barX, abilityY - 10, 60, 12, pct, COLORS.player, 'rgba(0,240,255,0.12)');
  } else {
    ctx.fillStyle = COLORS.player;
    ctx.fillText(boostKey + 'BOOST  READY', 20, abilityY);
  }
  ctx.shadowBlur = 0;

  // Decoy
  const decoyY = abilityY + 22;
  const decoyKey = isTouchDevice ? '' : '[F] ';
  ctx.shadowColor = COLORS.decoy;
  ctx.shadowBlur = 4;
  if (activeDecoy) {
    ctx.fillStyle = COLORS.decoy;
    ctx.shadowBlur = 10 + 5 * Math.sin(tNow * 15);
    ctx.fillText(decoyKey + 'DECOY  ACTIVE', 20, decoyY);
  } else if (player.decoyCooldown > 0) {
    const pct = 1 - player.decoyCooldown / DECOY_COOLDOWN;
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#667788';
    ctx.fillText(decoyKey + 'DECOY', 20, decoyY);
    const barX = decoyKey ? 110 : 80;
    drawCooldownBar(barX, decoyY - 10, 60, 12, pct, COLORS.decoy, 'rgba(255,68,255,0.12)');
  } else {
    ctx.fillStyle = COLORS.decoy;
    ctx.fillText(decoyKey + 'DECOY  READY', 20, decoyY);
  }
  ctx.shadowBlur = 0;

  // Wave announcement
  if (waveAnnounceTimer > 0) {
    waveAnnounceTimer -= dt * 1000;
    const alpha = Math.min(1, waveAnnounceTimer / 500);
    const age = 2000 - waveAnnounceTimer;
    ctx.globalAlpha = alpha;
    ctx.textAlign = 'center';

    // Chromatic aberration wave text (cyan + magenta fringe)
    ctx.font = 'bold 48px monospace';
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(0,240,255,0.7)';
    ctx.fillText(`WAVE ${wave}`, W / 2 - 2, H / 2 - 40);
    ctx.fillStyle = 'rgba(255,68,255,0.7)';
    ctx.fillText(`WAVE ${wave}`, W / 2 + 2, H / 2 - 40);
    ctx.shadowColor = '#ffffff';
    ctx.shadowBlur = 14;
    ctx.fillStyle = COLORS.uiText;
    ctx.fillText(`WAVE ${wave}`, W / 2, H / 2 - 40);
    ctx.shadowBlur = 0;

    // Underline wipe (left→right) during first 600ms
    const wipe = Math.min(1, age / 600);
    const lineW = 200 * wipe;
    ctx.strokeStyle = 'rgba(0,240,255,0.8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W / 2 - 100, H / 2 - 18);
    ctx.lineTo(W / 2 - 100 + lineW, H / 2 - 18);
    ctx.stroke();

    ctx.globalAlpha = 1;
  }

  // Touch controls UI
  if (isTouchDevice) drawTouchControls();

  // Border glow (breathing)
  const breathe = 0.12 + 0.10 * (0.5 + 0.5 * Math.sin(tNow * 0.8));
  const edgeColor = `rgba(0,240,255,${breathe.toFixed(3)})`;
  const edgeFade = 'rgba(0,240,255,0)';

  const grad = ctx.createLinearGradient(0, 0, 20, 0);
  grad.addColorStop(0, edgeColor);
  grad.addColorStop(1, edgeFade);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 20, H);

  const grad2 = ctx.createLinearGradient(W, 0, W - 20, 0);
  grad2.addColorStop(0, edgeColor);
  grad2.addColorStop(1, edgeFade);
  ctx.fillStyle = grad2;
  ctx.fillRect(W - 20, 0, 20, H);

  const grad3 = ctx.createLinearGradient(0, 0, 0, 20);
  grad3.addColorStop(0, edgeColor);
  grad3.addColorStop(1, edgeFade);
  ctx.fillStyle = grad3;
  ctx.fillRect(0, 0, W, 20);

  const grad4 = ctx.createLinearGradient(0, H, 0, H - 20);
  grad4.addColorStop(0, edgeColor);
  grad4.addColorStop(1, edgeFade);
  ctx.fillStyle = grad4;
  ctx.fillRect(0, H - 20, W, 20);

  // Corner tick marks
  const tick = 14;
  ctx.strokeStyle = `rgba(0,240,255,${(breathe * 1.8).toFixed(3)})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  // TL
  ctx.moveTo(6, 6 + tick); ctx.lineTo(6, 6); ctx.lineTo(6 + tick, 6);
  // TR
  ctx.moveTo(W - 6 - tick, 6); ctx.lineTo(W - 6, 6); ctx.lineTo(W - 6, 6 + tick);
  // BL
  ctx.moveTo(6, H - 6 - tick); ctx.lineTo(6, H - 6); ctx.lineTo(6 + tick, H - 6);
  // BR
  ctx.moveTo(W - 6, H - 6 - tick); ctx.lineTo(W - 6, H - 6); ctx.lineTo(W - 6 - tick, H - 6);
  ctx.stroke();

}

function drawTouchControls() {
  // Virtual joystick
  if (touch.joystick.active) {
    ctx.globalAlpha = 0.25;
    ctx.strokeStyle = COLORS.player;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(touch.joystick.startX, touch.joystick.startY, touch.JOYSTICK_RADIUS, 0, Math.PI * 2);
    ctx.stroke();

    ctx.globalAlpha = 0.4;
    ctx.fillStyle = COLORS.player;
    const knobX = touch.joystick.startX + touch.joystick.dx * touch.JOYSTICK_RADIUS;
    const knobY = touch.joystick.startY + touch.joystick.dy * touch.JOYSTICK_RADIUS;
    ctx.beginPath();
    ctx.arc(knobX, knobY, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Boost button
  const bc = getBoostCenter();
  const boostReady = player.afterburnerCooldown <= 0 && !player.afterburnerActive;
  const boostOnCooldown = player.afterburnerCooldown > 0;

  ctx.globalAlpha = touch.boost.active ? 0.5 : 0.3;
  ctx.strokeStyle = boostReady ? COLORS.player : '#555555';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(bc.x, bc.y, touch.BOOST_RADIUS, 0, Math.PI * 2);
  ctx.stroke();

  if (boostOnCooldown) {
    const pct = 1 - player.afterburnerCooldown / AFTERBURNER_COOLDOWN;
    ctx.strokeStyle = COLORS.player;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(bc.x, bc.y, touch.BOOST_RADIUS, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pct);
    ctx.stroke();
  }

  ctx.globalAlpha = boostReady ? 0.6 : 0.3;
  ctx.fillStyle = COLORS.uiText;
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('BOOST', bc.x, bc.y + 5);
  ctx.globalAlpha = 1;

  // Decoy button
  const fc = getDecoyCenter();
  const decoyReady = player.decoyCooldown <= 0 && !activeDecoy;
  const decoyOnCooldown = player.decoyCooldown > 0;

  ctx.globalAlpha = 0.3;
  ctx.strokeStyle = decoyReady ? COLORS.decoy : '#555555';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(fc.x, fc.y, touch.BOOST_RADIUS, 0, Math.PI * 2);
  ctx.stroke();

  if (decoyOnCooldown) {
    const pct = 1 - player.decoyCooldown / DECOY_COOLDOWN;
    ctx.strokeStyle = COLORS.decoy;
    ctx.globalAlpha = 0.5;
    ctx.beginPath();
    ctx.arc(fc.x, fc.y, touch.BOOST_RADIUS, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * pct);
    ctx.stroke();
  }

  ctx.globalAlpha = decoyReady ? 0.6 : 0.3;
  ctx.fillStyle = COLORS.uiText;
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'center';
  ctx.fillText('DECOY', fc.x, fc.y + 5);
  ctx.globalAlpha = 1;

  // Pause button (top-right, offset from lives)
  const pc = getPauseCenter();
  ctx.globalAlpha = 0.3;
  ctx.fillStyle = COLORS.uiText;
  ctx.fillRect(pc.x - 8, pc.y - 10, 5, 20);
  ctx.fillRect(pc.x + 3, pc.y - 10, 5, 20);
  ctx.globalAlpha = 1;
}

function drawMiniJet(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(-Math.PI / 2);
  ctx.fillStyle = COLORS.player;
  ctx.shadowColor = COLORS.player;
  ctx.shadowBlur = 4;
  ctx.beginPath();
  ctx.moveTo(8, 0);
  ctx.lineTo(-5, -4);
  ctx.lineTo(-3, 0);
  ctx.lineTo(-5, 4);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();
}

// Draws a decorative player-jet silhouette at arbitrary scale for menu backdrops
function drawMenuJetSilhouette(x, y, scale, angle, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.scale(scale, scale);
  // Soft cyan glow
  ctx.shadowColor = '#00f0ff';
  ctx.shadowBlur = 24;
  ctx.fillStyle = 'rgba(0,240,255,0.35)';
  ctx.beginPath();
  ctx.moveTo(16, 0);
  ctx.lineTo(-10, -9);
  ctx.lineTo(-6, 0);
  ctx.lineTo(-10, 9);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.restore();
}

// --- Screens ---
let menuJetX = -80;
function drawMenu() {
  const tNow = Date.now() * 0.001;

  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, W, H);
  drawStars();

  // Decorative jet drifting across (right→left) behind title
  menuJetX = ((tNow * 40) % (W + 200)) - 100;
  drawMenuJetSilhouette(menuJetX, H / 2 + 180, 1.5, 0, 0.5);
  // A second smaller jet on a different path
  const jet2X = (((tNow * 25 + 300) % (W + 200)) - 100);
  drawMenuJetSilhouette(jet2X, H * 0.25, 0.9, 0, 0.3);

  ctx.textAlign = 'center';

  // Title — chromatic aberration
  ctx.font = 'bold 64px monospace';
  ctx.letterSpacing = '8px';
  ctx.shadowBlur = 0;
  // Cyan fringe (offset left)
  ctx.fillStyle = 'rgba(0,240,255,0.75)';
  ctx.fillText('MISSILE DODGE', W / 2 - 2, H / 2 - 80);
  // Magenta fringe (offset right)
  ctx.fillStyle = 'rgba(255,68,255,0.75)';
  ctx.fillText('MISSILE DODGE', W / 2 + 2, H / 2 - 80);
  // White body on top with cyan glow
  ctx.shadowColor = COLORS.player;
  ctx.shadowBlur = 24;
  ctx.fillStyle = '#ffffff';
  ctx.fillText('MISSILE DODGE', W / 2, H / 2 - 80);
  ctx.shadowBlur = 0;
  ctx.letterSpacing = '0px';

  // Tagline
  ctx.fillStyle = '#aabbcc';
  ctx.font = '18px monospace';
  ctx.fillText('Outfly. Outmaneuver. Redirect.', W / 2, H / 2 - 40);

  // Controls
  ctx.fillStyle = '#667788';
  ctx.font = '14px monospace';
  if (isTouchDevice) {
    ctx.fillText('Drag to move    |    Tap BOOST / DECOY', W / 2, H / 2 + 20);
  } else {
    ctx.fillText('Arrow Keys / WASD to move    |    Space: Boost    F: Decoy', W / 2, H / 2 + 20);
    ctx.fillText('P / Escape to Pause', W / 2, H / 2 + 45);
  }

  // Start prompt
  const pulse = 0.5 + Math.sin(tNow * 4) * 0.5;
  ctx.globalAlpha = pulse;
  ctx.shadowColor = COLORS.player;
  ctx.shadowBlur = 8;
  ctx.fillStyle = COLORS.uiText;
  ctx.font = 'bold 20px monospace';
  ctx.fillText(isTouchDevice ? 'Tap to start' : 'Press ENTER to start', W / 2, H / 2 + 100);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;

  // High score
  if (highScore > 0) {
    ctx.shadowColor = COLORS.combo;
    ctx.shadowBlur = 8;
    ctx.fillStyle = COLORS.combo;
    ctx.font = '16px monospace';
    ctx.fillText(`High Score: ${highScore.toLocaleString()}`, W / 2, H / 2 + 140);
    ctx.shadowBlur = 0;
  }

  // Subtle CRT scanline overlay
  ctx.globalAlpha = 0.04;
  ctx.fillStyle = '#000000';
  for (let y = 0; y < H; y += 4) {
    ctx.fillRect(0, y, W, 1);
  }
  ctx.globalAlpha = 1;
}


function drawPaused() {
  ctx.fillStyle = 'rgba(10,14,26,0.7)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = COLORS.uiText;
  ctx.font = 'bold 48px monospace';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#ffffff';
  ctx.shadowBlur = 10;
  ctx.fillText('PAUSED', W / 2, H / 2);
  ctx.shadowBlur = 0;
  ctx.font = '16px monospace';
  ctx.fillStyle = '#aabbcc';
  ctx.fillText(isTouchDevice ? 'Tap to resume' : 'Press P or Escape to resume', W / 2, H / 2 + 40);
}

function drawGameOver() {
  const tNow = Date.now() * 0.001;

  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, W, H);
  drawStars();

  // Lingering particles (from the fatal hit) continue to render via gameLoop

  ctx.textAlign = 'center';

  // Chromatic aberration GAME OVER
  ctx.font = 'bold 56px monospace';
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,60,60,0.8)';
  ctx.fillText('GAME OVER', W / 2 - 3, H / 2 - 80);
  ctx.fillStyle = 'rgba(100,0,255,0.6)';
  ctx.fillText('GAME OVER', W / 2 + 3, H / 2 - 80);
  ctx.shadowColor = '#ff3333';
  ctx.shadowBlur = 18;
  ctx.fillStyle = '#ff5544';
  ctx.fillText('GAME OVER', W / 2, H / 2 - 80);
  ctx.shadowBlur = 0;

  // Score with glow
  ctx.shadowColor = '#ffffff';
  ctx.shadowBlur = 12;
  ctx.fillStyle = COLORS.uiText;
  ctx.font = 'bold 32px monospace';
  ctx.fillText(score.toLocaleString(), W / 2, H / 2 - 30);
  ctx.shadowBlur = 0;

  // Divider line
  ctx.strokeStyle = 'rgba(0,240,255,0.25)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(W / 2 - 120, H / 2 - 5);
  ctx.lineTo(W / 2 + 120, H / 2 - 5);
  ctx.stroke();

  ctx.fillStyle = '#aabbcc';
  ctx.font = '16px monospace';
  ctx.fillText(`Enemies Destroyed: ${enemiesDestroyed}`, W / 2, H / 2 + 20);
  ctx.fillText(`Highest Combo: x${highestCombo}`, W / 2, H / 2 + 45);
  ctx.fillText(`Waves Survived: ${wave}`, W / 2, H / 2 + 70);

  let infoY = H / 2 + 110;

  if (score >= highScore && score > 0) {
    ctx.fillStyle = COLORS.combo;
    ctx.font = 'bold 22px monospace';
    ctx.shadowColor = COLORS.combo;
    ctx.shadowBlur = 12 + 6 * Math.sin(tNow * 6);
    ctx.fillText('NEW HIGH SCORE!', W / 2, infoY);
    ctx.shadowBlur = 0;
    infoY += 35;
  }

  if (playerRank) {
    ctx.shadowColor = COLORS.player;
    ctx.shadowBlur = 6;
    ctx.fillStyle = '#aabbcc';
    ctx.font = '18px monospace';
    ctx.fillText(`Global Rank: #${playerRank}`, W / 2, infoY);
    ctx.shadowBlur = 0;
    infoY += 35;
  }

  const pulse = 0.5 + Math.sin(tNow * 4) * 0.5;
  ctx.globalAlpha = pulse;
  ctx.shadowColor = COLORS.player;
  ctx.shadowBlur = 8;
  ctx.fillStyle = COLORS.uiText;
  ctx.font = 'bold 18px monospace';
  ctx.fillText(isTouchDevice ? 'Tap for Leaderboard' : 'Press ENTER for Leaderboard', W / 2, infoY + 20);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

function drawRankBadge(x, y, rank) {
  // Gold, silver, bronze
  let fill, stroke;
  if (rank === 1) { fill = '#ffd700'; stroke = '#fff2a8'; }
  else if (rank === 2) { fill = '#c0c8d0'; stroke = '#ffffff'; }
  else { fill = '#cd7f32'; stroke = '#e8a86a'; }

  ctx.shadowColor = fill;
  ctx.shadowBlur = 8;
  ctx.fillStyle = fill;
  ctx.beginPath();
  ctx.arc(x, y, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.strokeStyle = stroke;
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.fillStyle = '#1a1410';
  ctx.font = 'bold 11px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(rank.toString(), x, y + 0.5);
  ctx.textBaseline = 'alphabetic';
}

function drawLeaderboard() {
  const tNow = Date.now() * 0.001;

  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(0, 0, W, H);
  drawStars();

  ctx.textAlign = 'center';

  // Title with chromatic aberration
  ctx.font = 'bold 36px monospace';
  ctx.shadowBlur = 0;
  ctx.fillStyle = 'rgba(255,68,255,0.65)';
  ctx.fillText('LEADERBOARD', W / 2 + 2, 60);
  ctx.shadowColor = COLORS.player;
  ctx.shadowBlur = 20;
  ctx.fillStyle = COLORS.player;
  ctx.fillText('LEADERBOARD', W / 2, 60);
  ctx.shadowBlur = 0;

  // Divider line
  ctx.strokeStyle = 'rgba(0,240,255,0.3)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(W / 2 - 250, 78);
  ctx.lineTo(W / 2 + 250, 78);
  ctx.stroke();

  if (leaderboardLoading) {
    ctx.fillStyle = '#667788';
    ctx.font = '18px monospace';
    ctx.fillText('Loading...', W / 2, H / 2);
    return;
  }

  if (!leaderboardData || leaderboardData.length === 0) {
    ctx.fillStyle = '#667788';
    ctx.font = '18px monospace';
    ctx.fillText('No scores yet. Be the first!', W / 2, H / 2);
  } else {
    // Table header
    const startY = 110;
    const rowH = 26;
    const colBadge = W / 2 - 230;
    const colRank = W / 2 - 200;
    const colName = W / 2 - 140;
    const colScore = W / 2 + 80;
    const colWaves = W / 2 + 200;

    ctx.textAlign = 'left';
    ctx.fillStyle = '#556677';
    ctx.font = 'bold 12px monospace';
    ctx.fillText('RANK', colRank, startY);
    ctx.fillText('PILOT', colName, startY);
    ctx.textAlign = 'right';
    ctx.fillText('SCORE', colScore, startY);
    ctx.fillText('WAVES', colWaves, startY);

    // Subtle header underline
    ctx.strokeStyle = 'rgba(100,130,160,0.3)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(W / 2 - 230, startY + 6);
    ctx.lineTo(W / 2 + 210, startY + 6);
    ctx.stroke();

    // Rows
    const maxRows = Math.min(leaderboardData.length, Math.floor((H - startY - 80) / rowH));
    let playerInList = false;

    for (let i = 0; i < maxRows; i++) {
      const entry = leaderboardData[i];
      const rank = i + 1;
      const y = startY + (i + 1) * rowH + 8;
      const isPlayer = entry.name === playerName;
      if (isPlayer) playerInList = true;

      // Row background
      if (isPlayer) {
        const glow = 0.15 + 0.1 * Math.sin(tNow * 4);
        ctx.fillStyle = `rgba(0,240,255,${glow.toFixed(3)})`;
        ctx.fillRect(W / 2 - 245, y - rowH + 6, 490, rowH);
        // Arrow indicator
        ctx.fillStyle = COLORS.player;
        ctx.font = 'bold 14px monospace';
        ctx.textAlign = 'left';
        ctx.fillText('▶', W / 2 - 258, y);
      } else if (i % 2 === 1) {
        ctx.fillStyle = 'rgba(255,255,255,0.025)';
        ctx.fillRect(W / 2 - 245, y - rowH + 6, 490, rowH);
      }

      // Rank badge (top 3) or plain number
      if (rank <= 3) {
        drawRankBadge(colBadge, y - 4, rank);
      } else {
        ctx.fillStyle = '#556677';
        ctx.font = '13px monospace';
        ctx.textAlign = 'left';
        ctx.fillText(`#${rank}`, colRank, y);
      }

      // Name + score
      const nameColor = isPlayer ? COLORS.combo : (rank === 1 ? '#ffd700' : rank === 2 ? '#e0e8f0' : rank === 3 ? '#e8a86a' : '#aabbcc');
      ctx.fillStyle = nameColor;
      ctx.font = isPlayer ? 'bold 14px monospace' : (rank <= 3 ? 'bold 14px monospace' : '14px monospace');

      if (isPlayer || rank <= 3) {
        ctx.shadowColor = nameColor;
        ctx.shadowBlur = 6;
      }

      ctx.textAlign = 'left';
      ctx.fillText(entry.name.length > 16 ? entry.name.slice(0, 15) + '…' : entry.name, colName, y);
      ctx.textAlign = 'right';
      ctx.fillText(entry.score.toLocaleString(), colScore, y);
      ctx.fillText(entry.waves_survived.toString(), colWaves, y);
      ctx.shadowBlur = 0;
    }

    // Player rank if not in visible list
    if (!playerInList && playerRank) {
      const rankY = startY + (maxRows + 2) * rowH;
      ctx.textAlign = 'center';
      ctx.shadowColor = COLORS.combo;
      ctx.shadowBlur = 10;
      ctx.fillStyle = COLORS.combo;
      ctx.font = 'bold 16px monospace';
      ctx.fillText(`YOUR RANK: #${playerRank}`, W / 2, rankY);
      ctx.shadowBlur = 0;
    }
  }

  // Continue prompt
  const pulse = 0.5 + Math.sin(tNow * 4) * 0.5;
  ctx.globalAlpha = pulse;
  ctx.textAlign = 'center';
  ctx.shadowColor = COLORS.player;
  ctx.shadowBlur = 6;
  ctx.fillStyle = COLORS.uiText;
  ctx.font = 'bold 16px monospace';
  ctx.fillText(isTouchDevice ? 'Tap to continue' : 'Press ENTER to continue', W / 2, H - 40);
  ctx.shadowBlur = 0;
  ctx.globalAlpha = 1;
}

// --- Main Loop ---
function gameLoop(time) {
  requestAnimationFrame(gameLoop);

  dt = Math.min((time - lastTime) / 1000, 0.05); // cap delta
  lastTime = time;

  if (state === 'MENU' || state === 'NAME_ENTRY') {
    updateStars();
    drawMenu();
    return;
  }

  if (state === 'GAME_OVER') {
    updateStars();
    updateParticles();
    drawGameOver();
    return;
  }

  if (state === 'LEADERBOARD') {
    updateStars();
    drawLeaderboard();
    return;
  }

  if (state === 'PAUSED') {
    // Draw game state frozen
    drawGame();
    drawPaused();
    return;
  }

  // PLAYING
  updateStars();
  updatePlayer();
  updateEnemies();
  updateDecoy();
  updateHeartPickup();
  updateMissiles();
  checkCollisions();
  updateParticles();
  updateTextPopups();
  updateWaves();

  // Combo timer
  if (comboTimer > 0) {
    comboTimer -= dt * 1000;
    if (comboTimer <= 0) { comboMultiplier = 1; combo = 0; }
  }

  // Screen shake
  if (shakeTimer > 0) shakeTimer -= dt * 1000;

  // Clean up dead entities
  enemies = enemies.filter(e => e.alive);
  missiles = missiles.filter(m => m.alive);

  drawGame();
}

function drawGame() {
  ctx.save();

  // Screen shake
  if (shakeTimer > 0) {
    const sx = (Math.random() - 0.5) * shakeIntensity * 2;
    const sy = (Math.random() - 0.5) * shakeIntensity * 2;
    ctx.translate(sx, sy);
  }

  // Background
  ctx.fillStyle = COLORS.bg;
  ctx.fillRect(-10, -10, W + 20, H + 20);

  drawStars();
  drawParticles();

  // Enemies
  for (const e of enemies) drawEnemy(e);

  // Missiles
  for (const m of missiles) drawMissile(m);

  // Heart pickup
  if (heartPickup) {
    const tNow = Date.now() * 0.001;
    const blink = Math.sin(tNow * 8) > -0.3; // visible most of the time, brief dip
    const fadeAlpha = heartPickup.life < 3000 ? (heartPickup.life / 3000) : 1;
    const hx = heartPickup.x, hy = heartPickup.y;

    // Pink halo (always visible, not blinking)
    const haloGrad = ctx.createRadialGradient(hx, hy, 0, hx, hy, 40);
    haloGrad.addColorStop(0, `rgba(255,100,140,${0.35 * fadeAlpha})`);
    haloGrad.addColorStop(0.5, `rgba(255,100,140,${0.12 * fadeAlpha})`);
    haloGrad.addColorStop(1, 'rgba(255,100,140,0)');
    ctx.fillStyle = haloGrad;
    ctx.fillRect(hx - 40, hy - 40, 80, 80);

    // Rotating light rays (always visible)
    ctx.save();
    ctx.translate(hx, hy);
    ctx.rotate(tNow * 0.5);
    ctx.strokeStyle = `rgba(255,200,220,${0.35 * fadeAlpha})`;
    ctx.lineWidth = 1;
    for (let i = 0; i < 4; i++) {
      ctx.rotate(Math.PI / 2);
      ctx.beginPath();
      ctx.moveTo(-22, 0); ctx.lineTo(-12, 0);
      ctx.moveTo(12, 0); ctx.lineTo(22, 0);
      ctx.stroke();
    }
    ctx.restore();

    // Orbiting sparkles
    for (let i = 0; i < 3; i++) {
      const a = tNow * 1.5 + (i / 3) * Math.PI * 2;
      const r = 18 + Math.sin(tNow * 3 + i) * 2;
      const sx = hx + Math.cos(a) * r;
      const sy = hy + Math.sin(a) * r;
      ctx.fillStyle = `rgba(255,255,255,${0.7 * fadeAlpha})`;
      ctx.fillRect(sx - 1, sy - 1, 2, 2);
    }

    if (blink) {
      ctx.globalAlpha = fadeAlpha;
      // Breathing scale
      const scale = 16 * (1 + 0.08 * Math.sin(tNow * 3));
      // Glow heart
      ctx.shadowColor = '#ff4466';
      ctx.shadowBlur = 18 + Math.sin(tNow * 6) * 5;
      ctx.fillStyle = '#ff4466';
      drawHeart(hx, hy, scale);
      ctx.fill();
      // Inner highlight
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#ffaabb';
      drawHeart(hx, hy, scale * 0.55);
      ctx.fill();
      // Specular highlight dot
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(hx - scale * 0.25, hy - scale * 0.15, scale * 0.12, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  // Active decoy
  if (activeDecoy) {
    const tNow = Date.now() * 0.001;
    const pulse = 0.6 + Math.sin(tNow * 12) * 0.4;
    const cx = activeDecoy.x, cy = activeDecoy.y;

    // Electromagnetic ripple rings (3 staggered)
    const cycle = (tNow * 1.2) % 1;
    for (let i = 0; i < 3; i++) {
      const phase = (cycle + i / 3) % 1;
      const r = 15 + phase * 55;
      const a = (1 - phase) * 0.5;
      ctx.strokeStyle = `rgba(255,68,255,${a.toFixed(3)})`;
      ctx.lineWidth = 2 * (1 - phase) + 0.5;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.stroke();
    }

    // Outer glow halo
    const haloGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 28 * pulse);
    haloGrad.addColorStop(0, 'rgba(255,68,255,0.5)');
    haloGrad.addColorStop(0.6, 'rgba(255,68,255,0.15)');
    haloGrad.addColorStop(1, 'rgba(255,68,255,0)');
    ctx.fillStyle = haloGrad;
    ctx.fillRect(cx - 30, cy - 30, 60, 60);

    // Rotating dashed outer ring
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(tNow * 2);
    ctx.strokeStyle = 'rgba(255,120,255,0.8)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.arc(0, 0, 14, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();

    // Counter-rotating diamond
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-tNow * 1.5);
    ctx.strokeStyle = 'rgba(255,180,255,0.9)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, -9); ctx.lineTo(9, 0); ctx.lineTo(0, 9); ctx.lineTo(-9, 0); ctx.closePath();
    ctx.stroke();
    ctx.restore();

    // Inner core with white hot spot
    ctx.shadowColor = COLORS.decoy;
    ctx.shadowBlur = 20 * pulse;
    ctx.fillStyle = COLORS.decoy;
    ctx.beginPath();
    ctx.arc(cx, cy, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(cx, cy, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    // Attract radius hint (subtle ring)
    ctx.strokeStyle = 'rgba(255,68,255,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(cx, cy, DECOY_ATTRACT_RADIUS, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Player
  if (state !== 'GAME_OVER') drawPlayer();

  drawTextPopups();
  drawHUD();

  ctx.restore();
}

// Start
requestAnimationFrame(gameLoop);
</script>
